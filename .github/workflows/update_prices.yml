name: Auto Update Product Prices

on:
  schedule:
    # يعمل تلقائياً مرتين يومياً (كل 12 ساعة - 00:00 و 12:00 بتوقيت UTC)
    - cron: '0 0,12 * * *'
  # يتيح لك تشغيله يدوياً في أي وقت من لوحة Actions في GitHub بضغطة زر
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Price Update Script
        run: |
          python scripts/auto_update_prices.py

      - name: Commit and Push if prices changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/db.json
          if git diff --staged --quiet; then
            echo "No price updates found. Repository is already up to date."
          else
            git commit -m "Auto-update product prices via GitHub Actions [skip ci]"
            git push origin main
            echo "Updated prices pushed successfully to main branch!"
          fi
